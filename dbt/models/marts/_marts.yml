version: 2

models:
  - name: mart_product_manufacturing
    columns:
      - name: product_ndc
        data_tests: [unique, not_null]
      - name: sourcing_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["unknown", "single_site", "multi_site"]

  - name: mart_facility_exposure
    columns:
      - name: duns
        data_tests: [unique, not_null]

  - name: mart_drug_supply
    columns:
      - name: drug_rxcui
        data_tests: [unique, not_null]
      - name: alternative_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["no_listed_alternative", "single_alternative", "multiple_alternatives"]

  - name: mart_shortage_risk
    columns:
      - name: drug_rxcui
        data_tests: [unique, not_null]
      - name: risk_tier
        data_tests:
          - accepted_values:
              arguments:
                values: ["critical", "high", "elevated", "watch"]
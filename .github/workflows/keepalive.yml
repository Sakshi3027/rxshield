name: Keep services awake

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /ready (wakes Render, touches Postgres and Neo4j)
        run: >
          curl --fail --silent --show-error
          --retry 5 --retry-delay 20 --retry-all-errors --max-time 90
          https://rxshield-api.onrender.com/ready
services:
  - type: web
    name: rxshield-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt && python -c "from retrieval.vector_search import get_model; get_model()"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.cache/fastembed
      - key: APP_DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
